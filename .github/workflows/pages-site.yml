name: Pages Site Gate

on:
  pull_request:
    branches: [gh-pages]

permissions:
  contents: read

jobs:
  verify-site:
    name: Pages Site Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate Pages-only scope and metadata
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import os
          import subprocess
          import xml.etree.ElementTree as ET

          allowed = {"index.html", "sitemap.xml", "robots.txt", "llms.txt", ".nojekyll"}
          # The bootstrap PR installs this site gate and scopes the old
          # artifact workflows to main; no runtime paths are permitted.
          if os.environ.get("PR_NUMBER") == "17":
              allowed |= {
                  ".github/workflows/public-ci.yml",
                  ".github/workflows/public-integrity.yml",
                  ".github/workflows/pages-site.yml",
              }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD^1", "HEAD"], text=True
          ).splitlines())
          if not changed or changed - allowed:
              raise SystemExit(f"Unexpected Pages PR paths: {sorted(changed - allowed)}")

          class Metadata(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.h1s = 0
                  self.in_h1 = False
                  self.h1_text = ""
                  self.canonical = []
                  self.robots = []
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == "h1":
                      self.h1s += 1
                      self.in_h1 = True
                  if tag == "link" and values.get("rel") == "canonical":
                      self.canonical.append(values.get("href"))
                  if tag == "meta" and values.get("name") == "robots":
                      self.robots.append(values.get("content", ""))
                  if tag == "a" and values.get("href"):
                      self.links.append(values["href"])
              def handle_endtag(self, tag):
                  if tag == "h1":
                      self.in_h1 = False
              def handle_data(self, data):
                  if self.in_h1:
                      self.h1_text += data

          site = "https://rud0lforrp.github.io/Human-Minority-Verifier/"
          page = Metadata()
          page.feed(Path("index.html").read_text(encoding="utf-8"))
          if page.h1s != 1 or "Human Minority Verifier" not in page.h1_text:
              raise SystemExit("Expected one Human Minority Verifier H1")
          if page.canonical != [site]:
              raise SystemExit(f"Wrong canonical: {page.canonical}")
          if any("noindex" in value.lower() for value in page.robots):
              raise SystemExit("Page carries noindex")
          if "https://rud0lforrp.github.io/Human-Minority/" not in page.links:
              raise SystemExit("Missing backlink to Human Minority")
          root = ET.fromstring(Path("sitemap.xml").read_text(encoding="utf-8"))
          namespace = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          locs = [n.text for n in root.findall(".//s:loc", namespace)]
          if locs != [site]:
              raise SystemExit(f"Unexpected sitemap URLs: {locs}")
          print("PAGES SITE GATE: PASS")
          PY
